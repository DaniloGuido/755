<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gugol - Entrar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0b0f17;
        }

        /* Subtle glowing background ambient lights */
        .ambient-glow-1 {
            position: absolute;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, rgba(0, 0, 0, 0) 70%);
            top: -100px;
            left: -100px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-glow-2 {
            position: absolute;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -120px;
            right: -120px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                        0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        /* Custom Input Glow on Focus */
        .input-field {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .input-field:focus-within {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        /* Custom Checkbox */
        .custom-checkbox:checked {
            background-color: #6366f1;
            border-color: #6366f1;
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-4 sm:p-6 md:p-8 text-slate-100 relative overflow-x-hidden">

    <!-- Background Glows -->
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <!-- Main Container -->
    <main class="w-full max-w-md relative z-10">
        <!-- Card Frame -->
        <div class="glass-card rounded-2xl p-6 sm:p-8 space-y-6">
            
            <!-- Header section -->
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 mb-2">
                    <i class="fa-solid fa-layer-group text-xl"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">gugol</h1>
                <p class="text-xs sm:text-sm text-slate-400">Bem-vindo de volta! Insira suas credenciais.</p>
            </div>

            <!-- Feedback Notification Box (Hidden by default) -->
            <div id="statusMessage" class="hidden rounded-xl p-3.5 text-sm transition-all duration-300"></div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-5" novalidate>
                
                <!-- Name / Username Field -->
                <div class="space-y-1.5">
                    <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
                        Nome ou E-mail
                    </label>
                    <div class="input-field flex items-center bg-slate-900/80 border border-slate-700/70 rounded-xl px-3.5 py-2.5">
                        <i class="fa-regular fa-user text-slate-400 mr-3 text-sm"></i>
                        <input 
                            type="text" 
                            id="username" 
                            name="username"
                            placeholder="Digite seu nome de usuário" 
                            required
                            class="w-full bg-transparent border-none text-sm text-slate-100 placeholder-slate-500 focus:outline-none"
                        >
                    </div>
                </div>

                <!-- Password Field -->
                <div class="space-y-1.5">
                    <div class="flex items-center justify-between">
                        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
                            Senha
                        </label>
                        <a href="#" class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors focus:outline-none focus:underline">
                            Esqueceu?
                        </a>
                    </div>
                    <div class="input-field flex items-center bg-slate-900/80 border border-slate-700/70 rounded-xl px-3.5 py-2.5">
                        <i class="fa-solid fa-lock text-slate-400 mr-3 text-sm"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="••••••••••••" 
                            required
                            class="w-full bg-transparent border-none text-sm text-slate-100 placeholder-slate-500 focus:outline-none"
                        >
                        <button 
                            type="button" 
                            id="togglePassword" 
                            aria-label="Alternar visibilidade da senha"
                            class="text-slate-400 hover:text-slate-200 focus:outline-none p-1 transition-colors"
                        >
                            <i class="fa-regular fa-eye text-sm" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center space-x-2.5 cursor-pointer group">
                        <input 
                            type="checkbox" 
                            id="remember" 
                            class="custom-checkbox w-4 h-4 rounded border-slate-700 bg-slate-900 focus:ring-0 focus:ring-offset-0 cursor-pointer accent-indigo-600 transition-colors"
                        >
                        <span class="text-xs sm:text-sm text-slate-400 group-hover:text-slate-300 transition-colors">
                            Lembrar neste dispositivo
                        </span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full py-3 px-4 bg-gradient-to-r from-indigo-500 via-purple-500 to-indigo-600 hover:opacity-95 text-white font-medium text-sm rounded-xl shadow-lg shadow-indigo-500/25 active:scale-[0.99] transition-all duration-200 flex items-center justify-center space-x-2 cursor-pointer focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-900"
                >
                    <span id="btnText">ENTRAR</span>
                    <i class="fa-solid fa-arrow-right text-xs" id="btnIcon"></i>
                </button>
            </form>

            <!-- Divider -->
            <div class="relative flex items-center justify-center my-4">
                <div class="border-t border-slate-800 w-full"></div>
                <span class="bg-[#121826] px-3 text-xs text-slate-500 uppercase tracking-wider absolute">
                    ou acesse com
                </span>
            </div>

            <!-- Social Buttons -->
            <div class="grid grid-cols-2 gap-3">
                <button 
                    type="button" 
                    onclick="handleSocialLogin('Google')"
                    class="flex items-center justify-center space-x-2 py-2.5 px-3 rounded-xl bg-slate-900/60 border border-slate-700/60 hover:bg-slate-800/80 text-xs text-slate-300 transition-all focus:outline-none"
                >
                    <i class="fa-brands fa-google text-red-400"></i>
                    <span>Google</span>
                </button>
                <button 
                    type="button" 
                    onclick="handleSocialLogin('GitHub')"
                    class="flex items-center justify-center space-x-2 py-2.5 px-3 rounded-xl bg-slate-900/60 border border-slate-700/60 hover:bg-slate-800/80 text-xs text-slate-300 transition-all focus:outline-none"
                >
                    <i class="fa-brands fa-github text-slate-200"></i>
                    <span>GitHub</span>
                </button>
            </div>

            <!-- Footer Link -->
            <p class="text-center text-xs text-slate-400 pt-2">
                Ainda não tem uma conta? 
                <a href="#" class="text-indigo-400 font-medium hover:text-indigo-300 transition-colors focus:outline-none focus:underline">
                    Cadastre-se grátis
                </a>
            </p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const toggleIcon = document.getElementById('toggleIcon');
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const statusMessage = document.getElementById('statusMessage');

            // 1. Password Visibility Toggle
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                
                // Toggle Eye Icon
                if (isPassword) {
                    toggleIcon.classList.remove('fa-eye');
                    toggleIcon.classList.add('fa-eye-slash');
                } else {
                    toggleIcon.classList.remove('fa-eye-slash');
                    toggleIcon.classList.add('fa-eye');
                }
            });

            // Helper function to display temporary notifications
            function showNotification(text, type = 'success') {
                statusMessage.classList.remove('hidden', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20', 'bg-red-500/10', 'text-red-400', 'border-red-500/20');
                
                if (type === 'success') {
                    statusMessage.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
                    statusMessage.innerHTML = `<i class="fa-solid fa-circle-check mr-2"></i> ${text}`;
                } else {
                    statusMessage.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/20');
                    statusMessage.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> ${text}`;
                }
            }

            // 2. Form Submission Handling with Animation
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const usernameVal = document.getElementById('username').value.trim();
                const passwordVal = passwordInput.value.trim();

                // Basic validation
                if (!usernameVal || !passwordVal) {
                    showNotification('Por favor, preencha todos os campos.', 'error');
                    return;
                }

                // Set loading state on button
                submitBtn.disabled = true;
                btnText.textContent = 'AUTENTICANDO...';
                btnIcon.className = 'fa-solid fa-spinner animate-spin text-xs';
                statusMessage.classList.add('hidden');

                // Simulate network latency (1.2 seconds)
                setTimeout(() => {
                    submitBtn.disabled = false;
                    btnText.textContent = 'ENTRAR';
                    btnIcon.className = 'fa-solid fa-arrow-right text-xs';

                    showNotification(`Login realizado com sucesso! Bem-vindo, ${usernameVal}.`, 'success');
                }, 1200);
            });
        });

        // Social Login Handler
        function handleSocialLogin(provider) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'border-red-500/20');
            statusMessage.classList.add('bg-indigo-500/10', 'text-indigo-300', 'border', 'border-indigo-500/20');
            statusMessage.innerHTML = `<i class="fa-brands fa-${provider.toLowerCase()} mr-2"></i> Redirecionando para login com ${provider}...`;
        }
    </script>
</body>
</html>
