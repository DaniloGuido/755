<!DOCTYPE html>
<!-- 
  Isso aqui é o "aviso" para o navegador de que esse arquivo é HTML5.
  Sempre é a primeira linha de qualquer página.
-->
<html lang="pt-BR">
<!-- <html> é a "caixa mãe" de tudo. lang="pt-BR" só avisa que o conteúdo está em português. -->
 
<head>
  <!-- 
    O <head> guarda informações PARA O NAVEGADOR, não para quem visita o site.
    Nada aqui aparece na tela.
  -->
  <meta charset="UTF-8">
  <!-- charset="UTF-8" evita que acentos (ã, ç, é) fiquem bagunçados -->
 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- isso faz a página se ajustar direito em celulares -->
 
  <title>Meu Login - Praticando HTML</title>
  <!-- <title> é o texto que aparece na abinha do navegador -->
 
  <style>
    /* ===================================================
       Aqui embaixo é CSS: as REGRAS DE APARÊNCIA.
       Cada bloco "seletor { propriedade: valor; }" 
       diz "quem" você está estilizando e "como".
    =================================================== */
 
    /* O * seleciona TODOS os elementos da página */
    * {
      box-sizing: border-box;
      /* 
        CORREÇÃO IMPORTANTE: isso faz com que padding e borda
        fiquem "dentro" da largura do elemento, em vez de somar
        e estourar o tamanho. Sem essa linha, um input com
        width:100% + padding pode ficar maior que a caixa dele.
      */
    }
 
    body {
      margin: 0;
      min-height: 100vh;
      /* 100vh = 100% da altura da tela inteira */
 
      display: flex;
      align-items: center;
      justify-content: center;
      /* essas 3 linhas juntas = centralizam a caixa de login
         na tela, tanto na vertical quanto na horizontal */
 
      background-color: #2c2c2c;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    }
 
    /* .login-caixa é uma CLASSE (por isso o ponto na frente).
       Classes servem para estilizar um elemento específico
       sem afetar todos os outros iguais a ele. */
    .login-caixa {
      width: 300px;
      background-color: #3a3a3a;
      color: rgb(230, 230, 230);
      padding: 40px;
      border: 2px solid #555555;
      border-radius: 15px;
    }
 
    h1 {
      text-align: center;
      font-size: 22px;
      margin: 0 0 25px 0;
    }
 
    label {
      display: block;
      /* 
        CORREÇÃO: sem "display: block", width/height no label
        não têm efeito, porque label é "inline" por padrão
        (só ocupa o espaço do próprio texto).
        Com "block", ele vira uma linha inteira, empurrando
        o input para baixo automaticamente (não precisa de <br>!).
      */
      font-weight: bold;
      margin-bottom: 6px;
    }
 
    input {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #555555;
      background: transparent;
      color: white;
    }
 
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #4f46e5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      /* cursor: pointer faz o mouse virar uma "mãozinha" ao passar por cima */
    }
 
    button:hover {
      /* :hover = regra que só vale quando o mouse está EM CIMA do botão */
      opacity: 0.9;
    }
 
    #mensagem {
      /* # é usado para ID (identificador único de UM elemento só) */
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      display: none;
      /* começa escondido, o JavaScript no final mostra quando precisar */
    }
  </style>
</head>
 
<body>
 
  <!-- 
    <div> é uma "caixa" genérica, sem significado especial.
    Aqui ela só agrupa visualmente o título + o formulário.
  -->
  <div class="login-caixa">
 
    <h1>Entrar</h1>
 
    <!-- 
      <form> agrupa os campos que "andam juntos".
      id="formLogin" dá um nome único pra esse formulário,
      usado lá embaixo no JavaScript.
    -->
    <form id="formLogin">
 
      <!-- 
        CORREÇÃO: for="nome" no label + id="nome" no input
        LIGAM os dois. Agora clicar no texto "Nome" também
        foca o campo de digitar.
      -->
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
 
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
      <!-- type="password" já esconde os caracteres sozinho, você não errou isso -->
 
      <button type="submit">ENTRAR</button>
      <!-- 
        dentro de um <form>, um botão já é "submit" por padrão,
        mas escrever type="submit" deixa mais claro pra quem lê o código
      -->
    </form>
 
    <p id="mensagem"></p>
 
  </div>
 
  <script>
    // A partir daqui é JAVASCRIPT (assunto futuro, não HTML).
    // Só está aqui para o botão "fazer alguma coisa" na tela,
    // já que não existe um servidor de verdade recebendo esse formulário.
 
    const form = document.getElementById('formLogin');
    const mensagem = document.getElementById('mensagem');
 
    form.addEventListener('submit', function (evento) {
      evento.preventDefault(); // impede a página de recarregar sozinha
      const nome = document.getElementById('nome').value;
      mensagem.textContent = 'Bem-vindo, ' + nome + '!';
      mensagem.style.display = 'block';
    });
  </script>
 
</body>
</html>
